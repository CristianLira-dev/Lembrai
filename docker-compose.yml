services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assistente
      POSTGRES_PASSWORD: assistente
      POSTGRES_DB: assistente_academico
    ports:
      - "5432:5432"
    volumes:
      - dados_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistente -d assistente_academico"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - dados_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  chatbot:
    build:
      context: ./chatbot
    environment:
      TOKEN_SERVICO_INTERNO: ${TOKEN_SERVICO_INTERNO:-desenvolvimento-token-interno}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/saude')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      AMBIENTE: ${AMBIENTE:-desenvolvimento}
      PORTA_BACKEND: 3000
      URL_FRONTEND: ${URL_FRONTEND:-http://localhost:5173}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY}
      CORS_ORIGENS: ${CORS_ORIGENS:-http://localhost:5173}
      DATABASE_URL: postgresql://assistente:assistente@postgres:5432/assistente_academico?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SEGREDO: ${JWT_SEGREDO:-desenvolvimento-troque-este-segredo}
      JWT_EXPIRACAO: ${JWT_EXPIRACAO:-7d}
      URL_CHATBOT: http://chatbot:8000
      TOKEN_SERVICO_INTERNO: ${TOKEN_SERVICO_INTERNO:-desenvolvimento-token-interno}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_CHAVE: ${EVOLUTION_API_CHAVE:-}
      EVOLUTION_API_INSTANCIA: ${EVOLUTION_API_INSTANCIA:-assistente-academico}
      EVOLUTION_WEBHOOK_SEGREDO: ${EVOLUTION_WEBHOOK_SEGREDO:-desenvolvimento-webhook}
      MODO_WHATSAPP: ${MODO_WHATSAPP:-simulado}
      CHAVE_CRIPTOGRAFIA_TOKENS: ${CHAVE_CRIPTOGRAFIA_TOKENS:-}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chatbot:
        condition: service_healthy

  trabalhador:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    environment:
      AMBIENTE: ${AMBIENTE:-desenvolvimento}
      DATABASE_URL: postgresql://assistente:assistente@postgres:5432/assistente_academico?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SEGREDO: ${JWT_SEGREDO:-desenvolvimento-troque-este-segredo}
      URL_CHATBOT: http://chatbot:8000
      TOKEN_SERVICO_INTERNO: ${TOKEN_SERVICO_INTERNO:-desenvolvimento-token-interno}
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-}
      EVOLUTION_API_CHAVE: ${EVOLUTION_API_CHAVE:-}
      EVOLUTION_API_INSTANCIA: ${EVOLUTION_API_INSTANCIA:-assistente-academico}
      EVOLUTION_WEBHOOK_SEGREDO: ${EVOLUTION_WEBHOOK_SEGREDO:-desenvolvimento-webhook}
      MODO_WHATSAPP: ${MODO_WHATSAPP:-simulado}
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      VITE_URL_API: http://localhost:3000/api
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_started

volumes:
  dados_postgres:
  dados_redis:
